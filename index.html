<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>نسخة — تجربة البحث</title>
    <style>
      :root {
        color-scheme: light dark;
        --muted: #777;
        --line: #8884;
        --accent: #2f4a3a;
      }
      body {
        font: 17px/1.7 system-ui, sans-serif;
        max-width: 760px;
        margin: 0 auto;
        padding: 16px;
      }
      h1 { margin: 0 0 4px; font-size: 1.6rem; }
      .muted { color: var(--muted); font-size: 0.85rem; }
      input[type='search'] {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: 1.2rem;
        padding: 8px 10px;
        margin: 12px 0 8px;
      }
      #cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      #cats button, .author {
        font: inherit;
        font-size: 0.85rem;
        border: 1px solid var(--line);
        background: none;
        color: inherit;
        border-radius: 4px;
        padding: 1px 8px;
        cursor: pointer;
      }
      #cats button[aria-pressed='true'] { background: var(--accent); color: #fff; }
      #authors { margin: 6px 0; }
      ol { list-style: none; padding: 0; margin: 0; }
      li { border-top: 1px solid var(--line); padding: 8px 6px; cursor: pointer; }
      li[aria-selected='true'] { outline: 2px solid var(--accent); outline-offset: -2px; }
      .title { font-size: 1.1rem; font-weight: 600; }
      .meta { font-size: 0.85rem; color: var(--muted); }
      .badge { font-size: 0.75rem; border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; margin-inline-start: 6px; }
      #book { border: 1px solid var(--line); padding: 12px; margin: 10px 0; }
      #book dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 8px 0; }
      #book dt { color: var(--muted); }
      #book dd { margin: 0; }
      kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <h1>نسخة</h1>
    <div class="muted">
      صفحة تجربة البحث (الخطوة ١) · <kbd>/</kbd> للبحث · <kbd>↑</kbd><kbd>↓</kbd> للتنقل · <kbd>Enter</kbd> لفتح الكتاب ·
      الصق رابط الشاملة أو رقم الكتاب
    </div>
    <input id="q" type="search" placeholder="ابحث عن كتاب أو مؤلف أو محقق…" autocomplete="off" autofocus aria-label="بحث" />
    <div id="cats" role="group" aria-label="الرفوف"></div>
    <div id="status" class="muted" aria-live="polite">جارٍ تحميل الفهرس…</div>
    <div id="authors"></div>
    <section id="book" hidden></section>
    <ol id="results" role="listbox" aria-label="النتائج"></ol>
    <script type="module" src="/src/test-page.ts"></script>
  </body>
</html>
