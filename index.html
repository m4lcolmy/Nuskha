<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>نسخة — المكتبة الشاملة، نسخةً في يدك</title>
    <meta name="description" content="ابحث في كتب المكتبة الشاملة وحمّلها بصيغة EPUB كاملة الجودة، في متصفحك ومجانًا." />
    <meta name="theme-color" content="#f6f1e7" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./data/catalog.json" as="fetch" crossorigin />
    <script>
      // Day by default; apply the reader's night choice before the first paint.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#1c1714';
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>تحتاج «نسخة» إلى تفعيل جافاسكربت.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
