# Once a week: rebuild the book list and the volume lists from turath, commit them if they changed,
# and start a deploy. turath's indexes are kept between runs in the Actions cache; when that cache
# has expired, the volume script keeps the lists it already has and fetches what turath allows.

name: Refresh catalog

on:
  schedule:
    - cron: '0 3 * * 5' # Friday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: turath-${{ github.run_id }}
          restore-keys: turath-

      - run: npm run catalog -- --refresh
      - run: npm run volumes

      # Saved even if a step above failed part way, so the next run carries on.
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: turath-${{ github.run_id }}

      - run: npm test

      - name: Commit and deploy if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh catalog from turath"
          git push
          # A push made with this workflow's token does not start other workflows, so start the deploy.
          gh workflow run deploy.yml --ref main
